name: PR Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-notarization:
        description: Sign and submit the native fixture to Apple (requires repository secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Offline action and bundle tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies and regenerate bundle
        run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Verify the committed action bundle is current
        run: git diff --exit-code -- dist
      - name: Build and run native integration fixture (no signing)
        run: |
          npm run build
          ./build/notarize-test

  notarize-defaults-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-notarization }}
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      term: xterm
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
        node-version:
          - '20'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build native test fixture
        run: npm run build
      - name: Sign
        uses: lando/code-sign-action@v2
        id: code-sign-action
        with:
          file: build/notarize-test
          certificate-data: ${{ secrets.APPLE_CERT_DATA }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          apple-product-id: dev.lando.notarize-action
          apple-team-id: FY8GAUX282
          options: --options runtime --entitlements entitlements.xml
      - name: Notarize
        uses: ./
        id: notarize-sign-action
        with:
          appstore-connect-username: ${{ secrets.APPLE_NOTARY_USER }}
          appstore-connect-password: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          appstore-connect-team-id: FY8GAUX282
          primary-bundle-id: dev.lando.notarize-action
          product-path: ${{ steps.code-sign-action.outputs.file }}
          verbose: true

      - name: "TEST: should notarize the file at input.product-path"
        run: codesign -vvvv -R="notarized" --check-notarization "$PRODUCT_PATH"
        env:
          PRODUCT_PATH: ${{ steps.notarize-sign-action.outputs.product-path }}
        shell: bash


  notarize-tool-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-notarization }}
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      term: xterm
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
        node-version:
          - '20'
        tool:
          # altool is deprecated now and it throws an error if you try to use it
          # - altool
          - notarytool

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build native test fixture
        run: npm run build
      - name: Sign
        uses: lando/code-sign-action@v2
        id: code-sign-action
        with:
          file: build/notarize-test
          certificate-data: ${{ secrets.APPLE_CERT_DATA }}
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
          apple-product-id: dev.lando.notarize-action
          apple-team-id: FY8GAUX282
          options: --options runtime --entitlements entitlements.xml
      - name: Notarize
        uses: ./
        id: notarize-sign-action
        with:
          appstore-connect-username: ${{ secrets.APPLE_NOTARY_USER }}
          appstore-connect-password: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          appstore-connect-team-id: FY8GAUX282
          primary-bundle-id: dev.lando.notarize-action
          product-path: ${{ steps.code-sign-action.outputs.file }}
          tool: ${{ matrix.tool }}
          verbose: true

      - name: "TEST: should notarize the file at input.product-path"
        run: codesign -vvvv -R="notarized" --check-notarization "$PRODUCT_PATH"
        env:
          PRODUCT_PATH: ${{ steps.notarize-sign-action.outputs.product-path }}
        shell: bash
